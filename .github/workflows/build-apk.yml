name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BRB-Statement-Analyzer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BRB-Statement-Analyzer-apk
          path: BRB-Statement-Analyzer.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Statement Analyzer v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: BRB-Statement-Analyzer.apk
          body: |
            Android APK built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Open this page on your phone, tap **BRB-Statement-Analyzer.apk**, and install it
            (allow "Install unknown apps" for your browser when asked).
