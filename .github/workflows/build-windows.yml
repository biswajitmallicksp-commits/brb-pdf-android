# Builds BRB PDF for Windows on GitHub's own Windows computer.
# Result (on the Releases page): BRB-PDF-Setup-x.y.z.exe (installer) and BRB-PDF-Portable-x.y.z.zip.
# The computers that use the program do NOT need Python - everything is inside.
name: Build BRB PDF for Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Get OCR language files (English, Bengali, Hindi)
        shell: bash
        run: |
          mkdir -p tessdata
          for l in eng ben hin; do
            if [ ! -s "tessdata/$l.traineddata" ]; then
              curl -fL --retry 3 -o "tessdata/$l.traineddata" "https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata"
            fi
          done
          ls -l tessdata

      - name: Get the offline AI engine (llama.cpp) and model (Qwen2.5 1.5B Instruct)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            New-Item -ItemType Directory -Force ai\llama, ai\models | Out-Null
            $rels = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=40"
            $rel = $null; $asset = $null
            foreach ($r in $rels) {
              if ($r.draft) { continue }
              $a = $r.assets | Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } | Select-Object -First 1
              if (-not $a) { $a = $r.assets | Where-Object { $_.name -match 'bin-win-avx2-x64\.zip$' } | Select-Object -First 1 }
              if ($a) { $rel = $r; $asset = $a; break }
            }
            if (-not $asset) {
              Write-Host "::notice::releases seen: $(($rels | Select-Object -First 5 | ForEach-Object { $_.tag_name + ' [' + (($_.assets | ForEach-Object name) -join ' ') + ']' }) -join ' | ')"
              throw "No Windows CPU build found in the recent llama.cpp releases"
            }
            Write-Host "::notice::llama.cpp $($rel.tag_name): $($asset.name)"
            Invoke-WebRequest $asset.browser_download_url -OutFile llama.zip
            Expand-Archive llama.zip -DestinationPath llama_tmp -Force
            $server = Get-ChildItem llama_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
            if (-not $server) { throw "llama-server.exe not in the zip" }
            Copy-Item "$($server.DirectoryName)\*" ai\llama -Recurse -Force
            Get-ChildItem ai\llama -Include *.exe -Recurse | Where-Object { $_.Name -ne 'llama-server.exe' } | Remove-Item
            # the Microsoft C++ runtime, so llama-server runs on PCs that do not have it installed
            foreach ($dll in 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll','vcomp140.dll') {
              if ((Test-Path "C:\Windows\System32\$dll") -and -not (Test-Path "ai\llama\$dll")) { Copy-Item "C:\Windows\System32\$dll" ai\llama }
            }
            Set-Content ai\llama\VERSION.txt "llama.cpp $($rel.tag_name) - $($asset.name) - MIT licence"
            $model = "ai\models\qwen2.5-1.5b-instruct-q4_k_m.gguf"
            Invoke-WebRequest "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" -OutFile $model
            $size = (Get-Item $model).Length
            Write-Host "::notice::Model size $([math]::Round($size/1MB)) MB"
            if ($size -lt 500MB) { throw "The model download looks incomplete" }
            Get-ChildItem ai -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } catch {
            Write-Host "::error::AI download step: $($_.Exception.Message) (line $($_.InvocationInfo.ScriptLineNumber))"
            throw
          }

      - name: Version
        id: ver
        shell: bash
        run: |
          base=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('app/config.py').read()).group(1))")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Tests
        shell: pwsh
        run: |
          function Run-Test($label, [string[]]$cmd) {
            $out = & python @cmd 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              $fails = ($out -split "`n" | Where-Object { $_ -match '^(FAIL|ERROR):|Error|assert' } | Select-Object -First 15) -join '%0A'
              $tail = ($out -split "`n" | Select-Object -Last 70 | ForEach-Object { $_.TrimEnd() }) -join '%0A'
              Write-Host "::error title=$label (summary)::$fails"
              Write-Host "::error title=$label (end of output)::$tail"
              throw "$label failed"
            }
          }
          Run-Test "unit tests" @("-m", "unittest", "discover", "-s", "tests")
          Run-Test "edit text panel" @("tests\test_text_panel_ui.py")
          Run-Test "editing UI" @("tests\test_edit_ui.py")
          Run-Test "AI panel" @("tests\test_ai_ui.py")

      - name: Live test with the real local AI model
        shell: pwsh
        run: |
          $out = & python tests\test_ai_live.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out -split "`n" | Select-Object -Last 70 | ForEach-Object { $_.TrimEnd() }) -join '%0A'
            Write-Host "::error title=live AI::$tail"
            Get-ChildItem "$env:LOCALAPPDATA\PDFWorkbench\logs\local-ai.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ -Tail 15 | ForEach-Object { Write-Host "::error title=local-ai.log::$_" } }
            throw "live AI test failed"
          }

      - name: Build the program (PyInstaller)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "python -m PyInstaller --noconfirm --clean --windowed --name PDFWorkbench --icon assets\app.ico --add-data assets;assets --exclude-module tkinter --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtMultimedia main.py > pyinstaller.log 2>&1"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content pyinstaller.log -Tail 60 | ForEach-Object { $_.TrimEnd() }) -join '%0A'
            Write-Host "::error title=PyInstaller (exit $code)::$tail"
            exit 1
          }
          try {
            $ErrorActionPreference = 'Stop'
            Copy-Item -Recurse tessdata dist\PDFWorkbench\tessdata
            Copy-Item README.md, THIRD_PARTY_LICENSES.md -Destination dist\PDFWorkbench\
            $size = (Get-ChildItem dist\PDFWorkbench -Recurse | Measure-Object Length -Sum).Sum
            Write-Host "::notice::Program folder $([math]::Round($size/1MB)) MB"
          } catch {
            Write-Host "::error title=copy::$($_.Exception.Message)"
            exit 1
          }

      - name: Check the program starts (no Python on the path)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python' }) -join ';'
          $q = Start-Process -FilePath "dist\PDFWorkbench\PDFWorkbench.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($q.HasExited) { throw "PDFWorkbench.exe closed by itself (exit code $($q.ExitCode))" }
          Stop-Process -Id $q.Id -Force
          Write-Host "PDFWorkbench.exe started and kept running."

      - name: Check the AI engine starts from the program folder
        shell: pwsh
        run: |
          Copy-Item -Recurse ai dist\PDFWorkbench\ai
          $p = Start-Process -FilePath "dist\PDFWorkbench\ai\llama\llama-server.exe" -ArgumentList "--version" -PassThru -Wait -NoNewWindow -RedirectStandardOutput v.txt -RedirectStandardError v2.txt
          Write-Host "::notice::llama-server --version -> exit $($p.ExitCode): $((Get-Content v.txt, v2.txt) -join ' ')"
          if ($p.ExitCode -ne 0) { throw "llama-server.exe does not run" }
          Remove-Item -Recurse -Force dist\PDFWorkbench\ai

      - name: Make the installers (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = "${{ steps.ver.outputs.version }}"
          # Lite: without the AI model (small download; AI features work in quick mode)
          & $iscc "/DAppVersion=$v" "/DEdition=Lite" installer\BRB-PDF.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (Lite)" }
          Compress-Archive -Path dist\PDFWorkbench -DestinationPath "output\BRB-PDF-Portable-Lite-$v.zip"
          # Full: with the offline AI model
          Copy-Item -Recurse ai dist\PDFWorkbench\ai
          Copy-Item installer\AI-LICENCES.txt dist\PDFWorkbench\ai\
          & $iscc "/DAppVersion=$v" installer\BRB-PDF.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (full)" }
          Get-ChildItem output | ForEach-Object { Write-Host "::notice::$($_.Name) $([math]::Round($_.Length/1MB)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: BRB-PDF-Windows
          path: output/*

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ steps.ver.outputs.version }}
          name: BRB PDF for Windows ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: output/*
          body: |
            BRB PDF for Windows 10/11 (64-bit). **Python is not needed. Works offline.**
            - **BRB-PDF-Setup-${{ steps.ver.outputs.version }}.exe** - full installer WITH the offline AI Assistant (about 1.2 GB): download, double-click, Next, Install. No administrator rights needed.
            - **BRB-PDF-Setup-Lite-${{ steps.ver.outputs.version }}.exe** - small installer without the AI model; the AI Assistant works in quick mode.
            - **BRB-PDF-Portable-Lite-${{ steps.ver.outputs.version }}.zip** - no installation: unzip and double-click PDFWorkbench.exe.
            Windows may say "Windows protected your PC" because the program is not signed: click **More info -> Run anyway**.
